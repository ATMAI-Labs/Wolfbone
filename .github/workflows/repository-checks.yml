name: Workspace and repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify the bundled mathematics corpus
        run: npm run library:verify
      - name: Test the finite core and workspace archive
        run: npm run test
      - name: Check application types
        run: npm run typecheck
      - name: Build the application
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test browser workflows
        run: npm run test:e2e
      - name: Check documentation and configuration
        run: sh scripts/check.sh
